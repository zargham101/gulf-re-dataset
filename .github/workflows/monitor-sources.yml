name: Monitor property sites

on:
  schedule:
    # Mondays 06:00 UTC — adjust in GitHub if you prefer another window
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run monitor:check

      - name: Commit snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/monitor-snapshot.json
          if git diff --staged --quiet; then
            echo "Monitor snapshot unchanged."
          else
            git commit -m "chore(monitor): weekly URL health check"
            git push
          fi
